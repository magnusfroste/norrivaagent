# Every push: vet, test, and prove all four binaries still build. The build is
# the product here — a single static file — so a target that stops compiling
# is a release that cannot happen.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile every target
        env:
          CGO_ENABLED: '0'
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w" -o /dev/null . && echo "ok $t"
          done

  # A tag builds the binaries and attaches them to the release, so publishing
  # is `git tag v0.2.0 && git push --tags` and nothing else.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.DefaultHost=https://norriva.lovable.app" \
              -o dist/norriva-${t%/*}-${t#*/} .
          done
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/norriva-*
          generate_release_notes: true
